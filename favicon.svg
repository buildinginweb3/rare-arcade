<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Cabinet outline -->
  <rect x="2" y="1" width="12" height="14" fill="#000000" />
  <rect x="3" y="2" width="10" height="12" fill="#ffffff" />
  <!-- Marquee / top banner -->
  <rect x="4" y="3" width="8" height="2" fill="#000000" />
  <!-- Glass prize window -->
  <rect x="4" y="6" width="8" height="4" fill="#ffffff" stroke="#000000" stroke-width="1" />
  <rect x="7" y="7" width="2" height="2" fill="#000000" />
  <!-- Prize hatch -->
  <rect x="5" y="11" width="6" height="2" fill="#000000" />
</svg>
